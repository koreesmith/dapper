name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Vet
        run: cd backend && go vet ./...
      - name: Unit tests
        run: cd backend && go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - name: Type-check and build
        run: cd web && npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      DAPPER_SETUP_CODE: ci-setup-code
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.demo.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Start an unconfigured Dapper and the demo directory
        run: $COMPOSE up -d --build
      - name: Wait for Dapper and the seeded directory
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz >/dev/null && \
              docker compose exec -T openldap ldapsearch -x -H ldap://localhost -D cn=admin,dc=example,dc=org -w admin \
                -b ou=people,dc=example,dc=org -s base dn >/dev/null 2>&1 && exit 0
            sleep 2
          done
          $COMPOSE logs
          exit 1
      - name: First-run setup and Settings tests
        run: SETUP_CODE=ci-setup-code ./scripts/e2e-setup.sh
      - name: End-to-end API tests
        run: ./scripts/e2e.sh
      - name: Linux (Unix) account tests
        run: ./scripts/e2e-unix.sh
      - name: Paging tests against the live directory
        run: cd backend && DAPPER_TEST_LDAP_URL=ldap://localhost:389 go test -count=1 ./internal/ldapclient/
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs
