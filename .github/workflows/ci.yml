name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Vet
        run: cd backend && go vet ./...
      - name: Unit tests
        run: cd backend && go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - name: Type-check and build
        run: cd web && npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start Dapper and a seeded OpenLDAP
        run: docker compose up -d --build
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Requested-With: dapper' \
              -H 'Content-Type: application/json' -d '{"username":"alice","password":"alicepass"}' \
              http://localhost:8080/api/login || true)
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: End-to-end API tests
        run: ./scripts/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
