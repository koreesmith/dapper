name: Release

# Runs when a version tag such as v1.0.0 is pushed: tests, builds the container image for amd64 and
# arm64 (the same for the directory server image in openldap/), publishes them to the GitHub Container Registry, and creates the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Unit tests
        run: cd backend && go vet ./... && go test ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Build and publish the directory server image
        uses: docker/build-push-action@v6
        with:
          context: openldap
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}-ldap:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}-ldap:latest

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: false
