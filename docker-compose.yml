# Dapper only. On first start it shows a setup wizard where you enter your own
# LDAP server's details; the setup code is printed in the log:
#   docker compose logs dapper
services:
  dapper:
    build:
      context: .
      args:
        VERSION: ${DAPPER_VERSION:-2.0.0}   # shown in the page footer: this release; override in .env (see .env.example)
    ports:
      # Set these in a .env file (see .env.example):
      #   DAPPER_PORT  the port to publish on this server (default 8080)
      #   DAPPER_BIND  127.0.0.1 when a reverse proxy in front of Dapper handles HTTPS (default: all interfaces)
      - "${DAPPER_BIND:-0.0.0.0}:${DAPPER_PORT:-8080}:8080"
    environment:
      DAPPER_SETUP_CODE: ${DAPPER_SETUP_CODE:-}   # optional: choose the setup code instead of a random one
    volumes:
      - dapper-data:/data   # settings made in the web UI are stored here
    restart: unless-stopped

volumes:
  dapper-data:
