# Dapper only. On first start it shows a setup wizard where you enter your own
# LDAP server's details; the setup code is printed in the log:
#   docker compose logs dapper
services:
  dapper:
    build: .
    ports:
      # Set DAPPER_BIND=127.0.0.1 (in a .env file) when a reverse proxy in front of Dapper handles HTTPS.
      - "${DAPPER_BIND:-0.0.0.0}:8080:8080"
    environment:
      DAPPER_SETUP_CODE: ${DAPPER_SETUP_CODE:-}   # optional: choose the setup code instead of a random one
    volumes:
      - dapper-data:/data   # settings made in the web UI are stored here
    restart: unless-stopped

volumes:
  dapper-data:
