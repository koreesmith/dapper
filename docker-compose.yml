services:
  dapper:
    build: .
    ports:
      - "8080:8080"

  # Development only: a throwaway OpenLDAP server to test against.
  # Dapper reaches it at ldap://openldap:389. Remove if you use your own server.
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
      - "636:636"
